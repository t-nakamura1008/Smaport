}

}

    background:#EF4444;

 .delete-selected-btn{

}

.delete-all-btn{
    background:#EF4444;
    color:white;
    border:none;
    padding:16px 28px;
    border-radius:14px;
    cursor:pointer;
    font-weight:bold;
    font-size:16px;
}

.delete-all-btn:hover{
    background:#DC2626;

window.supabase.createClient(

async function loadHistory(){

    const historyList =
        document.getElementById("historyList");

    const { data, error } = await sb
        .from("History")
        .select("*")
        .order("created_at", { ascending:false });

    if(error){
        alert(error.message);
        return;
    }

    historyList.innerHTML = "";

    if(data.length === 0){

        historyList.innerHTML =
            "<h2>履歴はありません</h2>";

        return;
    }

    data.forEach(item => {

        const date =
        new Date(item.created_at)
        .toLocaleString("ja-JP");

        historyList.innerHTML += `

        <div class="history-card">

            <div class="date">
                ${date}
            </div>

            <div class="action">
                ${item.action}
            </div>

            <div class="model">
                ${item.model}
            </div>
<div class="model">
    ${item.model}
</div>

${item.detail ? `
<div class="detail">
    ${item.detail}
</div>
` : ""}


        </div>

        `;

    });

}

loadHistory();

async function deleteAllHistory(){

    if(!confirm(
        "本当に全履歴を削除しますか？\nこの操作は元に戻せません。"
    )){
        return;
    }

    const { error } = await sb
        .from("History")
        .delete()
        .neq("id", 0);

    if(error){
        alert(error.message);
        return;
    }

    alert("全履歴を削除しました");

    loadHistory();
}
