<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>機種登録 | Smaport</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Yu Gothic",sans-serif;
}

body{
    background:#f8fafc;
}

header{
    background:#10B981;
    color:white;
    padding:20px;
}

.container{
    max-width:800px;
    margin:30px auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:10px;
}

button{
    background:#10B981;
    color:white;
    border:none;
    padding:15px 24px;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:#059669;
}

.back{
    display:inline-block;
    margin-top:20px;
    color:#10B981;
    text-decoration:none;
}
</style>
</head>

<body>

<header>
    <h1>📱 機種登録</h1>
</header>

<div class="container">

    <div class="form-group">
        <label>メーカー</label>
        <input id="maker" type="text" placeholder="Apple">
    </div>

    <div class="form-group">
        <label>機種名</label>
<input id="model" type="text" placeholder="iPhone 16 Pro">
    </div>

    <div class="form-group">
        <label>カラー</label>
       <input id="color" type="text" placeholder="ブラックチタニウム">
    </div>

    <div class="form-group">
        <label>RAM</label>
        <input id="ram" type="text" placeholder="8GB">
    </div>

    <div class="form-group">
        <label>ROM</label>
       <input id="rom" type="text" placeholder="256GB">
    </div>

    <div class="form-group">
        <label>バッテリー</label>
       <input id="battery" type="text" placeholder="3582mAh">
    </div>

    <div class="form-group">
        <label>カメラ</label>
        <input id="camera" type="text" placeholder="48MP">
    </div>

    <div class="form-group">
        <label>価格</label>
        <input id="price" type="text" placeholder="218,790円">
        <div class="form-group">
    <label>1回目～23回目</label>
    <input id="monthly_1_23" type="text" placeholder="3,052円">
</div>

<div class="form-group">
    <label>24回目～47回目</label>
    <input id="monthly_24_47" type="text" placeholder="6,457円">
</div>
    </div>

    <div class="form-group">
        <label>おすすめポイント</label>
        <textarea id="recommend" rows="4" placeholder="カメラ性能が高い"></textarea>
    </div>

    <button onclick="savePhone()">登録する</button>

<br><br>

<a href="dashboard.html" class="back">
    ← 管理画面へ戻る
</a>

</div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>
const supabaseUrl = "https://butujlsbdxaiuxitfyty.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1dHVqbHNiZHhhaXV4aXRmeXR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MjI2OTUsImV4cCI6MjEwMzI5ODY5NX0.yDC6HpV6rQzeG88sVwDlLOPB1dC_I-r5ID1JXoTeCAU";

const supabase = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

async function savePhone() {

    const data = {
    maker: document.getElementById("maker").value,
    model: document.getElementById("model").value,
    color: document.getElementById("color").value,
    ram: document.getElementById("ram").value,
    rom: document.getElementById("rom").value,
    battery: document.getElementById("battery").value,
    camera: document.getElementById("camera").value,
    price: document.getElementById("price").value,
    monthly_1_23: document.getElementById("monthly_1_23").value,
    monthly_24_47: document.getElementById("monthly_24_47").value,
    recommend: document.getElementById("recommend").value
};

    const { error } = await supabase
        .from("phones")
        .insert([data]);

    if(error){
        alert("登録失敗: " + error.message);
    } else {
        alert("登録成功！");
    }
}
</script>
</body>
</html>
