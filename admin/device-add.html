<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>機種登録 | Smaport</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Yu Gothic",sans-serif;
}

body{
    background:#f8fafc;
}

header{
    background:#10B981;
    color:white;
    padding:20px;
}

.container{
    max-width:800px;
    margin:30px auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:10px;
}

button{
    background:#10B981;
    color:white;
    border:none;
    padding:15px 24px;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:#059669;
}

.back{
    display:inline-block;
    margin-top:20px;
    color:#10B981;
    text-decoration:none;
}
</style>
</head>

<body>

<header>
    <h1>📱 機種登録</h1>
</header>

<div class="container">

   <div class="form-group">
        <label>メーカー</label>
        <input id="maker" type="text" placeholder="メーカー">
    </div>

    <div class="form-group">
        <label>機種名</label>
<input id="model" type="text" placeholder="機種名">
    </div>

    <div class="form-group">
        <label>カラー</label>
       <input id="color" type="text" placeholder="色">
    </div>

　　<div class="form-group">
    <label>画像URL</label>
    <input id="image_url" type="text" placeholder="https://example.com/image.jpg">
</div>
    
    <div class="form-group">
        <label>RAM</label>
        <input id="ram" type="text" placeholder="RAM">
    </div>

    <div class="form-group">
        <label>ROM</label>
       <input id="rom" type="text" placeholder="ROM">
    </div>

    <div class="form-group">
        <label>バッテリー</label>
       <input id="battery" type="text" placeholder="バッテリー">
    </div>

    <div class="form-group">
        <label>カメラ</label>
        <input id="camera" type="text" placeholder="画素数">
   </div>

    <div class="form-group">
    <label>価格</label>
    <input id="price" type="text" placeholder="一括価格">
</div>

<div class="form-group">
    <label>1回目～23回目</label>
    <input id="monthly_1_23" type="text" placeholder="円">
</div>

<div class="form-group">
    <label>24回目～47回目</label>
    <input id="monthly_24_47" type="text" placeholder="円">
</div>

    <div class="form-group">
        <label>おすすめポイント</label>
        <textarea id="recommend" rows="4" placeholder="おススメポイント"></textarea>
    </div>

    <button onclick="savePhone()">登録する</button>

    <br><br>

    <a href="dashboard.html" class="back">
        ← 管理画面へ戻る
    </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

<script>
alert("ページ読込成功");

function savePhone() {
    alert("ボタン押された！");
}
</script>

</body>
</html>
