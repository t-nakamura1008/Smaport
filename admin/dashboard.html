<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smaport Admin Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Yu Gothic",sans-serif;
}

body{
    background:#f8fafc;
}

header{
    background:#10B981;
    color:white;
    padding:20px;
}

header h1{
    font-size:2rem;
}

.container{
    max-width:1200px;
    margin:30px auto;
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    display:block;
    background:white;
    padding:25px;
    border-radius:20px;
    text-decoration:none;
    color:#1f2937;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card h2{
    color:#10B981;
    margin-bottom:10px;
}

.card p{
    color:#6b7280;
}

.logout{
    display:inline-block;
    margin-top:30px;
    text-decoration:none;
    color:#10B981;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
    <h1>🌿 Smaport Admin</h1>
</header>

<div class="container">

    <div class="grid">

        #
            <h2>📱 機種管理</h2>
            <p>機種の追加・編集・削除</p>
        </a>

        #
            <h2>🏢 メーカー管理</h2>
            <p>メーカーの追加・編集</p>
        </a>

        #
            <h2>🎨 カラー管理</h2>
            <p>カラー・限定カラー管理</p>
        </a>

        #">
            <h2>📸 スペック管理</h2>
            <p>RAM・ROM・カメラ・バッテリー管理</p>
        </a>

        # class="card">
            <h2>💰 価格管理</h2>
            <p>価格・カエドキプログラム編集</p>
        </a>

        #="card">
            <h2>⭐ おすすめ管理</h2>
            <p>おすすめポイント編集</p>
        </a>

    </div>

    .html" class="logout">
        ← ログイン画面へ戻る
    </a>

</div>

</body>
</html>
