<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smaport Admin</title>

<style>
body{
    margin:0;
    font-family:"Yu Gothic",sans-serif;
    background:#f8fafc;
}

header{
    background:#C4B5FD;
    color:#fff;
    padding:20px;
}

.container{
    max-width:900px;
    margin:30px auto;
    padding:20px;
}

.card{
    display:block;
    background:#fff;
    padding:25px;
    border-radius:20px;
    text-decoration:none;
    color:#111827;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}



.logout{
    display:inline-block;
    margin-top:20px;
    color:#F97316;
    text-decoration:none;
    font-weight:bold;
}

.menu-grid{
    display:flex;
    gap:20px;
}

.menu-grid .card{
    flex:1;
}

 .add-card h2{
    color:#10B981;
}

.manage-card h2{
    color:#38BDF8;
}

    
</style>
</head>

<body>

<header>
    <h1>🌿 Smaport Admin</h1>
</header>

<div class="container">

    <div class="menu-grid">

        <a href="device-add-v3.html" class="card add-card">
    <h2>📱 機種の登録</h2>
    <p>新しい機種を登録する</p>
</a>

<a href="device-manage.html" class="card manage-card">
    <h2>✏️ 機種の編集・削除</h2>
    <p>登録済み機種を管理する</p>
</a>

    </div>

    <a href="login.html" class="logout">
        ← ログアウト
    </a>

</div>

<script>

if(sessionStorage.getItem("login") != "ok"){

    location.href = "login.html";

}

</script>

    
</body>
</html>
