<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>機種管理</title>

<style>
body{
    margin:0;
    font-family:"Yu Gothic",sans-serif;
    background:#f8fafc;
}

header{
    background:#10B981;
    color:white;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:30px auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.phone-item{
    background:#f8fafc;
    padding:15px;
    margin-bottom:10px;
    border-radius:10px;
}

.phone-item button{
    margin-left:10px;
    padding:8px 12px;
}

.phone-item{
    background:#f8fafc;
    padding:15px;
    margin-bottom:10px;
    border-radius:10px;
}

.phone-item button{
    margin-left:10px;
}

.edit-btn{
    background:#FACC15;
    color:white;
    border:none;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    margin-left:10px;
}

.edit-btn:hover{
    background:#EAB308;
}

.delete-btn{
    background:#EF4444;
    color:white;
    border:none;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    margin-left:10px;
}

.delete-btn:hover{
    background:#DC2626;
}

.back-btn{
    background:#10B981;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.back-btn:hover{
    background:#059669;
}
    
#searchBox{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}
#searchBox{
width:80%;
max-width:400px;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
}

.device{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:15px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);

    text-align:center;
}

.maker{
    color:#6b7280;
    font-size:14px;
    margin-bottom:5px;
}

.device h3{
    margin:0 0 15px;
}

.button-area{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    width:100%;
}
    
</style>

</head>
<body>

<header>
    <h1>✏️ 機種の編集・削除</h1>
</header>

<div class="container">

    <div class="card">
        <h2>登録済み機種一覧</h2>

<input
    type="text"
    id="searchBox"
    placeholder="機種名で検索"
    oninput="loadPhones()">

<br><br>

        <div id="phoneList">
            読み込み中...
        </div>

    </div>

</div>

<br><br>

<button class="back-btn"
        onclick="location.href='dashboard.html'">
    ← 管理画面に戻る
</button>

    

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl = "https://butujlsbdxaiuxitfyty.supabase.co";

const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1dHVqbHNiZHhhaXV4aXRmeXR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MjI2OTUsImV4cCI6MjEwMzI5ODY5NX0.yDC6HpV6rQzeG88sVwDlLOPB1dC_I-r5ID1JXoTeCAU";

const sb = window.supabase.createClient(
    supabaseUrl,
    supabaseKey

 );   

try {

async function loadPhones(){

    const { data, error } = await sb
        .from("Phones")
        .select("*");

    if(error){
        alert(error.message);
        return;
    }

    const keyword =
        document.getElementById("searchBox").value
        .toLowerCase();

    phoneList.innerHTML = "";

    data
    .filter(phone =>
        (
            phone.maker &&
            phone.maker.toLowerCase().includes(keyword)
        )
        ||
        (
            phone.model &&
            phone.model.toLowerCase().includes(keyword)
        )
    )
    .forEach(phone => {

        phoneList.innerHTML += `
        <div class="device">

            <div class="maker">
                ${phone.maker}
            </div>

            <h3>${phone.model}</h3>

            <div class="button-area">

                <button
                    class="edit-btn"
                    onclick="location.href='device-edit.html?id=${phone.id}'">
                    編集
                </button>

                <button
                    class="delete-btn"
                    onclick="deletePhone(${phone.id})">
                    削除
                </button>

            </div>

        </div>
        `;

    });

}

window.loadPhones = loadPhones;

loadPhones();

} catch(e){

    alert(e.message);

}

window.deletePhone = async function(id){

    if(!confirm("削除しますか？")){
        return;
    }

    const { error } = await sb
        .from("Phones")
        .delete()
        .eq("id", id);

    if(error){
        alert("エラー：" + error.message);
        return;
    }

    alert("削除成功");

    loadPhones();

}
    
</script>
    
</body>
</html>
