<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>機種管理</title>

<style>
body{
    margin:0;
    font-family:"Yu Gothic",sans-serif;
    background:#f8fafc;
}

header{
    background:#10B981;
    color:white;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:30px auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.phone-item{
    background:#f8fafc;
    padding:15px;
    margin-bottom:10px;
    border-radius:10px;
}

.phone-item button{
    margin-left:10px;
    padding:8px 12px;
}

.phone-item{
    background:#f8fafc;
    padding:15px;
    margin-bottom:10px;
    border-radius:10px;
}

.phone-item button{
    margin-left:10px;
}
    
</style>

</head>
<body>

<header>
    <h1>✏️ 機種の編集・削除</h1>
</header>

<div class="container">

    <div class="card">
        <h2>登録済み機種一覧</h2>

        <div id="phoneList">
            読み込み中...
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

alert("①");

const supabaseUrl = "https://butujlsbdxaiuxitfyty.supabase.co";

alert("②");

const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1dHVqbHNiZHhhaXV4aXRmeXR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MjI2OTUsImV4cCI6MjEwMzI5ODY5NX0.yDC6HpV6rQzeG88sVwDlLOPB1dC_I-r5ID1JXoTeCAU";

alert("③");

alert(window.supabase ? "あり" : "なし");

alert(typeof window.supabase.createClient);

alert("④前");

try {

const supabase = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

alert("④後");

async function loadPhones(){

    alert("⑤開始");

    const { data, error } = await supabase
        .from("Phones")
        .select("*");

    if(error){
        alert(error.message);
        return;
    }

    alert("取得件数：" + data.length);

    phoneList.innerHTML = "";

data.forEach(phone => {

　 phoneList.innerHTML +=
    phone.maker + " " +
    phone.model +
    ' <button onclick="deletePhone(' + phone.id + ')">削除</button><br>';

});

}

loadPhones();

} catch(e){

    alert(e.message);

}

window.deletePhone = async function(id){

    alert("ID=" + id);

    if(!confirm("削除しますか？")){
        return;
    }

    alert("削除処理開始");

    const { error } = await supabase
        .from("Phones")
        .delete()
        .eq("id", id);

    alert("DELETE実行後");

    if(error){
        alert("エラー：" + error.message);
        return;
    }

    alert("削除成功");
}



</script>
    
</body>
</html>
