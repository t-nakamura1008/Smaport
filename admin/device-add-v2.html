<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>テスト</title>
</head>
<body>

<h1>📱 機種登録</h1>

<input id="maker" placeholder="メーカー">

<br><br>

<input id="model" placeholder="機種名">

<br><br>

<input id="color" placeholder="カラー">

<br><br>

<input id="price" placeholder="一括価格">

<br><br>

<button onclick="savePhone()">登録する</button>

<script>

function savePhone() {

    const maker = document.getElementById("maker").value;
    const model = document.getElementById("model").value;
    const color = document.getElementById("color").value;
    const price = document.getElementById("price").value;

    alert(
        "メーカー: " + maker +
        "\n機種名: " + model +
        "\nカラー: " + color +
        "\n価格: " + price
    );

}

</script>

</body>
</html>
