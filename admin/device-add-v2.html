<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>テスト</title>
</head>
<body>

<h1>📱 機種登録</h1>

<input id="maker" placeholder="メーカー">

<br><br>

<input id="model" placeholder="機種名">

<br><br>

<button onclick="savePhone()">登録する</button>

<script>

function savePhone() {

    const maker = document.getElementById("maker").value;
    const model = document.getElementById("model").value;

    alert(
        "メーカー: " + maker +
        "\n機種名: " + model
    );

}

</script>

</body>
</html>
