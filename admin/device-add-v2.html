<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>機種登録 | Smaport</title>
</head>

<body>

<h1>📱 機種登録</h1>

<input id="maker" placeholder="メーカー">

<br><br>

<input id="model" placeholder="機種名">

<br><br>

<input id="color" placeholder="カラー">

<br><br>

<input id="image_url" placeholder="画像URL">

<br><br>

<input id="ram" placeholder="RAM">

<br><br>

<input id="rom" placeholder="ROM">

<br><br>

<input id="battery" placeholder="バッテリー">

<br><br>

<input id="camera" placeholder="カメラ画素数">

<br><br>

<input id="price" placeholder="一括価格">

<br><br>

<input id="monthly_1_23" placeholder="1回目～23回目">

<br><br>

<input id="monthly_24_47" placeholder="24回目～47回目">

<br><br>

<textarea
    id="recommend"
    placeholder="おすすめポイント"
    rows="4"
    cols="50">
</textarea>

<br><br>

<button onclick="savePhone()">登録する</button>

<script>

function savePhone() {

    const maker = document.getElementById("maker").value;
    const model = document.getElementById("model").value;
    const color = document.getElementById("color").value;
    const image_url = document.getElementById("image_url").value;
    const ram = document.getElementById("ram").value;
    const rom = document.getElementById("rom").value;
    const battery = document.getElementById("battery").value;
    const camera = document.getElementById("camera").value;
    const price = document.getElementById("price").value;
    const monthly_1_23 = document.getElementById("monthly_1_23").value;
    const monthly_24_47 = document.getElementById("monthly_24_47").value;
    const recommend = document.getElementById("recommend").value;

    alert(
        "メーカー: " + maker +
        "\n機種名: " + model +
        "\nカラー: " + color +
        "\n画像URL: " + image_url +
        "\nRAM: " + ram +
        "\nROM: " + rom +
        "\nバッテリー: " + battery +
        "\nカメラ: " + camera +
        "\n価格: " + price +
        "\n1～23回目: " + monthly_1_23 +
        "\n24～47回目: " + monthly_24_47 +
        "\nおすすめ: " + recommend
    );

}

</script>

</body>
</html>
