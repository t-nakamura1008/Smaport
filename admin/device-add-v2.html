<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>機種登録 | Smaport</title>
</head>

<body>

<h1>📱 機種登録</h1>

<input id="maker" placeholder="メーカー">

<br><br>

<input id="model" placeholder="機種名">

<br><br>

<input id="color" placeholder="カラー">

<br><br>

<input id="image_url" placeholder="画像URL">

<br><br>

<input id="ram" placeholder="RAM">

<br><br>

<input id="rom" placeholder="ROM">

<br><br>

<input id="battery" placeholder="バッテリー">

<br><br>

<input id="camera" placeholder="カメラ画素数">

<br><br>

<input id="price" placeholder="一括価格">

<br><br>

<input id="monthly_1_23" placeholder="1回目～23回目">

<br><br>

<input id="monthly_24_47" placeholder="24回目～47回目">

<br><br>

<textarea
    id="recommend"
    placeholder="おすすめポイント"
    rows="4"
    cols="50">
</textarea>

<br><br>

<button onclick="savePhone()">登録する</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/s
<script>

const supabaseUrl = "https://butujlsbdxaiuxitfyty.supabase.co/rest/v1/";

const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1dHVqbHNiZHhhaXV4aXRmeXR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MjI2OTUsImV4cCI6MjEwMzI5ODY5NX0.yDC6HpV6rQzeG88sVwDlLOPB1dC_I-r5ID1JXoTeCAU";

const supabase = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

async function savePhone() {

    const data = {
        maker: document.getElementById("maker").value,
        model: document.getElementById("model").value,
        color: document.getElementById("color").value,
        image_url: document.getElementById("image_url").value,
        ram: document.getElementById("ram").value,
        rom: document.getElementById("rom").value,
        battery: document.getElementById("battery").value,
        camera: document.getElementById("camera").value,
        price: document.getElementById("price").value,
        monthly_1_23: document.getElementById("monthly_1_23").value,
        monthly_24_47: document.getElementById("monthly_24_47").value,
        recommend: document.getElementById("recommend").value
    };

    const { error } = await supabase
        .from("phones")
        .insert([data]);

    if(error){
        alert("登録失敗: " + error.message);
    } else {
        alert("登録成功！");
    }
}

</script>
</body>
</html>
