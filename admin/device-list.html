<!DOCTYPE html>
<html lang="ja">
<head>

<title>機種一覧 | Smaport</title>

<style>
body{
    margin:0;
    font-family:"Yu Gothic",sans-serif;
    background:#f8fafc;
}

header{
    background:#7C3AED;
    color:white;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:30px auto;
    padding:20px;
}

.device{
    background:white;

    margin-bottom:15px;

}

.back{
    display:inline-block;
    margin-top:20px;
    color:#10B981;
    text-decoration:none;
}

.device{
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:15px;
    padding:20px;
    margin-bottom:15px;
}

.maker{
    color:#6b7280;
    font-size:14px;
    margin-bottom:5px;
}

.device h3{
    margin:0 0 15px;
}

.button-area{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}
.btn{
    border:none;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
}

.edit{
    background:#FACC15;
    color:white;
}

.delete{
    background:#EF4444;
    color:white;
}

.copy{
background:#8B5CF6;
color:white;
}
</style>
</head>

<body>

<header>
    <h1>📱 機種一覧</h1>
</header>

<div class="container">

    <div id="deviceList"></div>

    <a href="dashboard.html" class="back">
        ← 管理画面へ戻る
    </a>

</div>

<script>

const supabaseUrl = "https://butujlsbdxaiuxitfyty.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1dHVqbHNiZHhhaXV4aXRmeXR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MjI2OTUsImV4cCI6MjEwMzI5ODY5NX0.yDC6HpV6rQzeG88sVwDlLOPB1dC_I-r5ID1JXoTeCAU";

const supabase = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

async function loadDevices(){

    const { data, error } = await supabase
        .from("Phones")
        .select("*");

    if(error){
        alert(error.message);
        return;
    }

    const deviceList = document.getElementById("deviceList");

    deviceList.innerHTML = "";

    data.forEach(phone => {

        deviceList.innerHTML += `
        <div class="device">

            <div class="maker">
                ${phone.maker}
            </div>

            <h3>${phone.model}</h3>

          <div class="button-area">

    <button
    class="btn copy"
    onclick="copyPhone(${phone.id})">
    📋複製
</button>
 
    <button
        class="btn edit"
        onclick="location.href='device-edit.html?id=${phone.id}'">
        編集
    </button>

    <button
        class="btn delete"
        onclick="deletePhone(${phone.id})">
        削除
    </button>

</div>
        </div>
        `;

    });

}

async function deletePhone(id){

    if(!confirm("削除しますか？")){
        return;
    }

    const { error } = await supabase
        .from("Phones")
        .delete()
        .eq("id", id);

    if(error){
        alert("削除失敗");
    }else{
        alert("削除成功");
        loadDevices();
    }
}

function copyPhone(id){

    alert(id);

}

loadDevices();


</script>

</body>
