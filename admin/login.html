<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smaport Admin</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Yu Gothic",sans-serif;
}

body{
    background:#f8fafc;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    width:400px;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.logo{
    text-align:center;
    font-size:2rem;
    font-weight:bold;
    color:#10B981;
    margin-bottom:10px;
}

.sub{
    text-align:center;
    color:#6b7280;
    margin-bottom:30px;
}

.input-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:10px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#10B981;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#059669;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    text-decoration:none;
    color:#10B981;
}
</style>

</head>

<body>

<div class="login-box">

    <div class="logo">Smaport Admin</div>

    <p class="sub">
        管理画面ログイン
    </p>

    <div class="input-group">
        <label>ID</label>
        <input type="text" placeholder="IDを入力">
    </div>

    <div class="input-group">
        <label>パスワード</label>
        <input type="password" placeholder="パスワードを入力">
    </div>

<button>ログイン</button>

<a href="../index.html" class="back">
    ← Smaportへ戻る
</a>

</div>

</body>
</html>
