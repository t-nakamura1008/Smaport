<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smaport管理者用</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Yu Gothic",sans-serif;
}

body{
    background:#f8fafc;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    width:500px;
    background:white;
    padding:50px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(249,115,22,.25);
}

.logo{
    text-align:center;
    font-size:2.2rem;
    font-weight:bold;
    color:#F97316;
    margin-bottom:15px;
    white-space:nowrap;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#F97316;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#EA580C;
}

 input{
    width:100%;
    padding:15px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
}

 .input-group{
    margin-bottom:25px;
}   
    
</style>

</head>

<body>

<div class="login-box">

    <div class="logo">Smaport 管理者用</div>

    <p class="sub">
        管理画面ログイン
    </p>

<div class="input-group">
    <label>ID</label>
    <input
        id="loginId"
        type="text"
        placeholder="IDを入力">
</div>

<div class="input-group">
    <label>パスワード</label>
    <input
        id="password"
        type="password"
        placeholder="パスワードを入力">
</div>

<button onclick="window.login()">
    ログイン
</button>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl = "https://butujlsbdxaiuxitfyty.supabase.co";

const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1dHVqbHNiZHhhaXV4aXRmeXR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MjI2OTUsImV4cCI6MjEwMzI5ODY5NX0.yDC6HpV6rQzeG88sVwDlLOPB1dC_I-r5ID1JXoTeCAU";

const sb = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

window.login = async function(){

    const { data, error } = await sb
        .from("Admins")
        .select("*")
        .eq("login_id", loginId.value.trim())
        .eq("password", password.value.trim())
        .single();

    if(error || !data){

        alert("IDまたはパスワードが違います");
        return;

    }

    location.href = "dashboard.html";

}


</script>



</body>
</html>
