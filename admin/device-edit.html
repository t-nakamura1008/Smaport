<html>
<head>

<style>

body{
    background:#E0F2FE;
    font-family:"Yu Gothic",sans-serif;
    margin:0;
}

.container{
    max-width:700px;
    margin:50px auto;
}

.card{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h1{
    color:#0284C7;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #CBD5E1;
    border-radius:10px;
}

button{
    background:#38BDF8;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:#0EA5E9;
}

.back-btn{
    display:inline-block;

    background:#F9A8D4;
    color:white !important;
    text-decoration:none;

    padding:8px 12px;
    border-radius:10px;

    font-size:14px;
    white-space:nowrap;

    width:80px;
    text-align:center;
}

 .update-btn{
    background:#FACC15;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
}

.update-btn:hover{
    background:#EAB308;
}

.back-btn{
    display:inline-block;

    background:#F9A8D4;
    color:white !important;
    text-decoration:none;

    padding:8px 12px;
    border-radius:10px;

    font-size:14px;

    text-align:left;

    white-space:nowrap;

    width:auto;
}
    

</style>

</head>

<body>


<div class="container">
    <div class="card">

<h1>機種編集</h1>

メーカー
<input id="maker" placeholder="メーカー">

<br><br>

機種名
<input id="model" placeholder="機種名">

<br><br>

発売日
<input id="release_date" placeholder="発売日">

<br><br>
        
カラー
<input id="color" placeholder="カラー">

<br><br>

画像URL
<input id="image_url" placeholder="画像URL">

<br><br>

ディスプレイサイズ
<input id="display_size" placeholder="ディスプレイサイズ">

<br><br>

RAM
<input id="ram" placeholder="RAM">

<br><br>

ROM
<input id="rom" placeholder="ROM">

<br><br>

バッテリー
<input id="battery" placeholder="バッテリー">

<br><br>

カメラ画素数
<input id="camera" placeholder="カメラ画素数">

<br><br>

一括価格
<input id="price" placeholder="一括価格">

<br><br>

1回目～23回目
<input id="monthly_1_23" placeholder="1回目～23回目">

<br><br>

24回目～47回目
<input id="monthly_24_47" placeholder="24回目～47回目">

<br><br>

 ケータイ補償
<input id="keitai_hosho" placeholder="ケータイ補償">

<br><br>       

おすすめポイント
<textarea
    id="recommend"
    placeholder="おすすめポイント"
    rows="4"></textarea>

<br><br>

<button onclick="updatePhone()">更新</button>

    <br><br>

    <a href="device-manage.html" class="back-btn">
    ← 機種一覧
　　</a>


    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl = "https://butujlsbdxaiuxitfyty.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1dHVqbHNiZHhhaXV4aXRmeXR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MjI2OTUsImV4cCI6MjEwMzI5ODY5NX0.yDC6HpV6rQzeG88sVwDlLOPB1dC_I-r5ID1JXoTeCAU";

const sb = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

const params = new URLSearchParams(location.search);
const id = params.get("id");

let originalPhone = null;


async function loadPhone(){

    const { data, error } = await sb
        .from("Phones")
        .select("*")
        .eq("id", id)
        .single();

    if(error){
        alert(error.message);
        return;
    }

 originalPhone = data;   

maker.value = data.maker;
model.value = data.model;
release_date.value =data.release_date || "";    
color.value = data.color;
image_url.value = data.image_url;
display_size.value = data.display_size;
ram.value = data.ram;
rom.value = data.rom;
battery.value = data.battery;
camera.value = data.camera;
price.value = data.price;
monthly_1_23.value = data.monthly_1_23;
monthly_24_47.value = data.monthly_24_47;
keitai_hosho.value = data.keitai_hosho || "";    
recommend.value = data.recommend;


}

loadPhone();

window.updatePhone = async function(){

    const modelName = model.value;

    let details = [];

    details.push("テスト");

    const { error } = await sb
        .from("Phones")
        .update({
            maker: maker.value,
            model: model.value,
            release_date: release_date.value,
            color: color.value,
            image_url: image_url.value,
            display_size: display_size.value,
            ram: ram.value,
            rom: rom.value,
            battery: battery.value,
            camera: camera.value,
            price: price.value,
            monthly_1_23: monthly_1_23.value,
            monthly_24_47: monthly_24_47.value,
            keitai_hosho: keitai_hosho.value,
            recommend: recommend.value
        })
        .eq("id", id);

    if(error){
        alert(error.message);
        return;
    }

    await sb
        .from("History")
        .insert([{
            action: "編集",
            model: modelName,
            detail: details.join(" / ")
        }]);

    alert("更新成功");

    location.href = "device-manage.html";
}

</script>

</body>
</html>
