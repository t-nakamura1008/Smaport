<html>
<head>

<style>

body{
    background:#E0F2FE;
    font-family:"Yu Gothic",sans-serif;
    margin:0;
}

.container{
    max-width:700px;
    margin:50px auto;
}

.card{

    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h1{
    color:#0284C7;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #CBD5E1;
    border-radius:10px;
}

button{
    background:#38BDF8;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:#0EA5E9;
}

.back-btn{
    display:inline-block;

    background:#F9A8D4;

    text-decoration:none;

    padding:8px 12px;

    font-size:14px;

}

 .update-btn{
    background:#FACC15;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
}

.update-btn:hover{
    background:#EAB308;
}

.back-btn{
    display:inline-block;

    background:#F9A8D4;
    color:white !important;
    text-decoration:none;

    padding:8px 12px;
    border-radius:10px;

    font-size:14px;

    text-align:left;

    white-space:nowrap;

    width:auto;
}
    

</style>

</head>

<body>


<div class="container">
    <div class="card">

<h1>機種編集</h1>

メーカー
<input id="maker" placeholder="メーカー">

<br><br>

機種名
<input id="model" placeholder="機種名">

<br><br>

発売日

<input id="color" placeholder="カラー">

<br><br>

画像URL
<input id="image_url" placeholder="画像URL">

<br><br>

ディスプレイサイズ
<input id="display_size" placeholder="ディスプレイサイズ">

<br><br>

RAM
<input id="ram" placeholder="RAM">

<br><br>

ROM

<input id="battery" placeholder="バッテリー">

<br><br>

<input id="price" placeholder="一括価格">

<br><br>

<input id="monthly_1_23" placeholder="1回目～23回目">

23か月利用時総額
<input id="total23months" placeholder="23か月利用時総額">

<br><br>

24回目～47回目
<input id="monthly_24_47" placeholder="24回目～47回目">

<br><br>

<h3>【MNP】</h3>

<input id="price_mnp" placeholder="MNP 一括価格">

<input id="monthly_1_23_mnp" placeholder="MNP 1回目～23回目">

<input id="total_23months_mnp" placeholder="MNP 23か月利用時総額">

<input id="monthly_24_47_mnp" placeholder="MNP 24回目～47回目">

<h3>【新規】</h3>

<input id="price_new" placeholder="新規 一括価格">

<input id="monthly_1_23_new" placeholder="新規 1回目～23回目">

<input id="total_23months_new" placeholder="新規 23か月利用時総額">

<input id="monthly_24_47_new" placeholder="新規 24回目～47回目">

<h3>【ポイ活】</h3>

<input id="price_poikatsu" placeholder="ポイ活 一括価格">

<input id="monthly_1_23_poikatsu" placeholder="ポイ活 1回目～23回目">

<input id="total_23months_poikatsu" placeholder="ポイ活 23か月利用時総額">

<input id="monthly_24_47_poikatsu" placeholder="ポイ活 24回目～47回目">
        
        
 ケータイ補償
<input id="keitai_hosho" placeholder="ケータイ補償">

<br><br>       

おすすめポイント
<textarea
    id="recommend"
    placeholder="おすすめポイント"
    rows="4"></textarea>

<br><br>

<button onclick="updatePhone()">更新</button>

    <br><br>

    <a href="device-manage.html" class="back-btn">
    ← 機種一覧
　　</a>


    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl = "https://butujlsbdxaiuxitfyty.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1dHVqbHNiZHhhaXV4aXRmeXR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MjI2OTUsImV4cCI6MjEwMzI5ODY5NX0.yDC6HpV6rQzeG88sVwDlLOPB1dC_I-r5ID1JXoTeCAU";

const sb = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

const params = new URLSearchParams(location.search);
const id = params.get("id");

let originalPhone = null;


async function loadPhone(){

    const { data, error } = await sb
        .from("Phones")
        .select("*")
        .eq("id", id)
        .single();

    if(error){
        alert(error.message);
        return;
    }

 originalPhone = data;   

maker.value = data.maker;
model.value = data.model;
release_date.value =data.release_date || "";    
color.value = data.color;
image_url.value = data.image_url;
display_size.value = data.display_size;
ram.value = data.ram;
rom.value = data.rom;
battery.value = data.battery;
camera.value = data.camera;
price.value = data.price;
monthly_1_23.value = data.monthly_1_23;
total23months.value =data.total_23months || "";    
monthly_24_47.value = data.monthly_24_47;
price_mnp.value = data.price_mnp || "";
monthly_1_23_mnp.value = data.monthly_1_23_mnp || "";
total_23months_mnp.value = data.total_23months_mnp || "";
monthly_24_47_mnp.value = data.monthly_24_47_mnp || "";

price_new.value = data.price_new || "";
monthly_1_23_new.value = data.monthly_1_23_new || "";
total_23months_new.value = data.total_23months_new || "";
monthly_24_47_new.value = data.monthly_24_47_new || "";

price_poikatsu.value = data.price_poikatsu || "";
monthly_1_23_poikatsu.value = data.monthly_1_23_poikatsu || "";
total_23months_poikatsu.value = data.total_23months_poikatsu || "";
monthly_24_47_poikatsu.value = data.monthly_24_47_poikatsu || "";    
keitai_hosho.value = data.keitai_hosho || "";    
recommend.value = data.recommend;


}

loadPhone();

window.updatePhone = async function(){

    const modelName = model.value;

    let details = [];

if(originalPhone.maker !== maker.value){
    details.push(
        `メーカー ${originalPhone.maker} → ${maker.value}`
    );
}

if(originalPhone.model !== model.value){
    details.push(
        `機種名 ${originalPhone.model} → ${model.value}`
    );
}

if(originalPhone.release_date !== release_date.value){
    details.push(
        `発売日 ${originalPhone.release_date} → ${release_date.value}`
    );
}

if(originalPhone.color !== color.value){
    details.push(
        `カラー ${originalPhone.color} → ${color.value}`
    );
}

if(originalPhone.display_size !== display_size.value){
    details.push(
        `ディスプレイ ${originalPhone.display_size} → ${display_size.value}`
    );
}

if(originalPhone.ram !== ram.value){
    details.push(
        `RAM ${originalPhone.ram} → ${ram.value}`
    );
}

if(originalPhone.rom !== rom.value){
    details.push(
        `ROM ${originalPhone.rom} → ${rom.value}`
    );
}

if(originalPhone.battery !== battery.value){
    details.push(
        `バッテリー ${originalPhone.battery} → ${battery.value}`
    );
}

if(originalPhone.camera !== camera.value){
    details.push(
        `カメラ ${originalPhone.camera} → ${camera.value}`
    );
}

if(originalPhone.price !== price.value){
    details.push(
        `一括価格 ${originalPhone.price} → ${price.value}`
    );
}

if(originalPhone.monthly_1_23 !== monthly_1_23.value){
    details.push(
        `1～23回 ${originalPhone.monthly_1_23} → ${monthly_1_23.value}`
    );
}

 if(originalPhone.total_23months !== total23months.value){
    details.push(
        `23か月利用時総額 ${originalPhone.total_23months} → ${total23months.value}`
    );
}   

if(originalPhone.monthly_24_47 !== monthly_24_47.value){
    details.push(
        `24～47回 ${originalPhone.monthly_24_47} → ${monthly_24_47.value}`
    );
}

// MNP

if(originalPhone.price_mnp !== price_mnp.value){
    details.push(
        `MNP一括価格 ${originalPhone.price_mnp} → ${price_mnp.value}`
    );
}

if(originalPhone.monthly_1_23_mnp !== monthly_1_23_mnp.value){
    details.push(
        `MNP1～23回 ${originalPhone.monthly_1_23_mnp} → ${monthly_1_23_mnp.value}`
    );
}

if(originalPhone.total_23months_mnp !== total_23months_mnp.value){
    details.push(
        `MNP23か月利用時総額 ${originalPhone.total_23months_mnp} → ${total_23months_mnp.value}`
    );
}

if(originalPhone.monthly_24_47_mnp !== monthly_24_47_mnp.value){
    details.push(
        `MNP24～47回 ${originalPhone.monthly_24_47_mnp} → ${monthly_24_47_mnp.value}`
    );
}


// 新規

if(originalPhone.price_new !== price_new.value){
    details.push(
        `新規一括価格 ${originalPhone.price_new} → ${price_new.value}`
    );
}

if(originalPhone.monthly_1_23_new !== monthly_1_23_new.value){
    details.push(
        `新規1～23回 ${originalPhone.monthly_1_23_new} → ${monthly_1_23_new.value}`
    );
}

if(originalPhone.total_23months_new !== total_23months_new.value){
    details.push(
        `新規23か月利用時総額 ${originalPhone.total_23months_new} → ${total_23months_new.value}`
    );
}

if(originalPhone.monthly_24_47_new !== monthly_24_47_new.value){
    details.push(
        `新規24～47回 ${originalPhone.monthly_24_47_new} → ${monthly_24_47_new.value}`
    );
}


// ポイ活

if(originalPhone.price_poikatsu !== price_poikatsu.value){
    details.push(
        `ポイ活一括価格 ${originalPhone.price_poikatsu} → ${price_poikatsu.value}`
    );
}

if(originalPhone.monthly_1_23_poikatsu !== monthly_1_23_poikatsu.value){
    details.push(
        `ポイ活1～23回 ${originalPhone.monthly_1_23_poikatsu} → ${monthly_1_23_poikatsu.value}`
    );
}

if(originalPhone.total_23months_poikatsu !== total_23months_poikatsu.value){
    details.push(
        `ポイ活23か月利用時総額 ${originalPhone.total_23months_poikatsu} → ${total_23months_poikatsu.value}`
    );
}

if(originalPhone.monthly_24_47_poikatsu !== monthly_24_47_poikatsu.value){
    details.push(
        `ポイ活24～47回 ${originalPhone.monthly_24_47_poikatsu} → ${monthly_24_47_poikatsu.value}`
    );
}    

if(originalPhone.keitai_hosho !== keitai_hosho.value){
    details.push(
        `ケータイ補償 ${originalPhone.keitai_hosho} → ${keitai_hosho.value}`
    );
}

if(originalPhone.recommend !== recommend.value){
    details.push(
        `おすすめポイント変更`
    );
}
    const { error } = await sb
        .from("Phones")
        .update({
            maker: maker.value,
            model: model.value,
            release_date: release_date.value,
            color: color.value,
            image_url: image_url.value,
            display_size: display_size.value,
            ram: ram.value,
            rom: rom.value,
            battery: battery.value,
            camera: camera.value,
            price: price.value,
            monthly_1_23: monthly_1_23.value,
            total_23months:document.getElementById("total23months").value,
            monthly_24_47: monthly_24_47.value,
            price_mnp: price_mnp.value,
monthly_1_23_mnp: monthly_1_23_mnp.value,
total_23months_mnp: total_23months_mnp.value,
monthly_24_47_mnp: monthly_24_47_mnp.value,

price_new: price_new.value,
monthly_1_23_new: monthly_1_23_new.value,
total_23months_new: total_23months_new.value,
monthly_24_47_new: monthly_24_47_new.value,

price_poikatsu: price_poikatsu.value,
monthly_1_23_poikatsu: monthly_1_23_poikatsu.value,
total_23months_poikatsu: total_23months_poikatsu.value,
monthly_24_47_poikatsu: monthly_24_47_poikatsu.value,
            keitai_hosho: keitai_hosho.value,
            recommend: recommend.value
        })
        .eq("id", id);

    if(error){
        alert(error.message);
        return;
    }

    await sb
        .from("History")
        .insert([{
            action: "編集",
            model: modelName,
            detail: details.join(" / ")
        }]);

    alert("更新成功");

    location.href = "device-manage.html";
}

</script>

</body>
</html>
