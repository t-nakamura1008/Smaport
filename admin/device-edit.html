<html>
<head>

<style>

body{
    background:#E0F2FE;
    font-family:"Yu Gothic",sans-serif;
    margin:0;
}

.container{
    max-width:700px;
    margin:50px auto;
}

.card{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h1{
    color:#0284C7;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #CBD5E1;
    border-radius:10px;
}

button{
    background:#38BDF8;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:#0EA5E9;
}

</style>

</head>
<body>


<div class="container">
    <div class="card">

        <h1>機種編集</h1>

        メーカー
        <input id="maker">

        <br><br>

        機種名
        <input id="model">

        <br><br>

        <button onclick="updatePhone()">更新</button>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl = "https://butujlsbdxaiuxitfyty.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1dHVqbHNiZHhhaXV4aXRmeXR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MjI2OTUsImV4cCI6MjEwMzI5ODY5NX0.yDC6HpV6rQzeG88sVwDlLOPB1dC_I-r5ID1JXoTeCAU";

const sb = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

const params = new URLSearchParams(location.search);
const id = params.get("id");

async function loadPhone(){

    const { data, error } = await sb
        .from("Phones")
        .select("*")
        .eq("id", id)
        .single();

    if(error){
        alert(error.message);
        return;
    }

    maker.value = data.maker;
    model.value = data.model;

}

loadPhone();

window.updatePhone = async function(){

    const { error } = await sb
        .from("Phones")
        .update({
            maker: maker.value,
            model: model.value
        })
        .eq("id", id);

    if(error){
        alert(error.message);
        return;
    }

    alert("更新成功");

    location.href = "device-manage.html";

}

</script>

</body>
</html>
