<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>見積管理ログイン</title>

<style>

body{
  font-family:sans-serif;
  background:#fff8f0;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  background:white;
  width:700px;
  padding:60px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 8px 25px rgba(0,0,0,0.1);
  border-top:8px solid #2563eb;
}

h1{
  color:#2563eb;
  font-size:3rem;
}

select{
  width:100%;
  padding:18px;
  font-size:20px;
  margin-bottom:30px;
}

button{
  width:100%;
  padding:18px;
  font-size:22px;
  font-weight:bold;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

</style>
</head>

<body>

<div class="container">

  <h1>📋 見積管理</h1>

  <select id="store">

    <option value="">
      店舗を選択してください
    </option>

    <option>イオンモール高の原</option>
    <option>葛城南</option>
    <option>北野白梅町</option>
    <option>西大寺</option>
    <option>桜井</option>
    <option>天理</option>
    <option>桃谷</option>
    <option>大和高田</option>

  </select>

  <button onclick="login()">
    ログイン
  </button>

</div>

<script>

function login(){

  const store =
    document.getElementById("store")
      .value;

  if(!store){

    alert("店舗を選択してください");

    return;

  }

  localStorage.setItem(
    "adminStore",
    store
  );

  location.href =
    "admin.html";

}

</script>

</body>
</html>
