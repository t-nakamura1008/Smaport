<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl =
    "https://butujlsbdxaiuxitfyty.supabase.co";
    
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1dHVqbHNiZHhhaXV4aXRmeXR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MjI2OTUsImV4cCI6MjEwMzI5ODY5NX0.yDC6HpV6rQzeG88sVwDlLOPB1dC_I-r5ID1JXoTeCAU";

const sbClient = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

try {    

let phonesData = [];

async function loadPhones(){

const { data, error } = await sbClient
    .from("Phones")
    .select("*");

if(error){
alert("エラー：" + error.message);
return;
}

phonesData = data;
    
const maker1 = document.getElementById("maker1");
const maker2 = document.getElementById("maker2");

const fixedMakers = [
    "Apple",
    "Google",
    "Samsung",
    "SONY",
    "SHARP",
    "FCNT"
];

fixedMakers.forEach(maker => {

    const option1 = document.createElement("option");
    option1.value = maker;
    option1.textContent = maker;

    const option2 = document.createElement("option");
    option2.value = maker;
    option2.textContent = maker;

    maker1.appendChild(option1);
    maker2.appendChild(option2);

});
    
   
}
    
sessionStorage.removeItem(
    "comparisonLogSaved"
);

loadPhones();

function showPhone1(){

    const selectedId =
        document.getElementById("phone1").value;

    const phone =
        phonesData.find(p => p.id == selectedId);

    if(!phone) return;

document.getElementById("release1").textContent =
    phone.release_date;
    
document.getElementById("color1").textContent =
phone.color;

document.getElementById("image1").innerHTML =
    '<img src="' + phone.image_url + '" class="phone-image">';

document.getElementById("display1").textContent=
    phone.display_size;

document.getElementById("ram1").textContent = phone.ram;
document.getElementById("rom1").textContent = phone.rom;
document.getElementById("battery1").textContent = phone.battery;
document.getElementById("camera1").textContent = phone.camera;
const plan =
    document.getElementById("plan1").value;

if(plan === "mnp"){

    document.getElementById("price1").textContent =
        phone.price_mnp;

    document.getElementById("monthly123_1").textContent =
        phone.monthly_1_23_mnp;

    document.getElementById("total23_1").textContent =
        phone.total_23months_mnp;

    document.getElementById("monthly2447_1").textContent =
        phone.monthly_24_47_mnp;

}
else if(plan === "new"){

    document.getElementById("price1").textContent =
        phone.price_new;

    document.getElementById("monthly123_1").textContent =
        phone.monthly_1_23_new;

    document.getElementById("total23_1").textContent =
        phone.total_23months_new;

    document.getElementById("monthly2447_1").textContent =
        phone.monthly_24_47_new;

}
else if(plan === "poikatsu"){

    document.getElementById("price1").textContent =
        phone.price_poikatsu;

    document.getElementById("monthly123_1").textContent =
        phone.monthly_1_23_poikatsu;

    document.getElementById("total23_1").textContent =
        phone.total_23months_poikatsu;

    document.getElementById("monthly2447_1").textContent =
        phone.monthly_24_47_poikatsu;

}
else{

    document.getElementById("price1").textContent =
        phone.price;

    document.getElementById("monthly123_1").textContent =
        phone.monthly_1_23;

    document.getElementById("total23_1").textContent =
        phone.total_23months;

    document.getElementById("monthly2447_1").textContent =
        phone.monthly_24_47;

}
document.getElementById("hosho1").textContent =phone.keitai_hosho;    
document.getElementById("recommend1").textContent = phone.recommend;

compareRam();
compareRom();
compareBattery();    
    
saveComparisonTemp();

}
  
function showPhone2(){

    const selectedId =
        document.getElementById("phone2").value;

    const phone =
        phonesData.find(p => p.id == selectedId);

    if(!phone) return;

document.getElementById("release2").textContent =phone.release_date;
    
document.getElementById("color2").textContent = phone.color;
    
document.getElementById("image2").innerHTML =
    '<img src="' + phone.image_url + '" class="phone-image">';

document.getElementById("display2").textContent =
    phone.display_size;

document.getElementById("ram2").textContent =

document.getElementById("rom2").textContent =

document.getElementById("battery2").textContent =

document.getElementById("camera2").textContent =

const plan =

if(plan === "mnp"){

        phone.price_mnp;

        phone.monthly_1_23_mnp;

    document.getElementById("total23_2").textContent =
        phone.total_23months_mnp;

    document.getElementById("monthly2447_2").textContent =
        phone.monthly_24_47_mnp;

}
else if(plan === "new"){

    document.getElementById("price2").textContent =
        phone.price_new;

    document.getElementById("monthly123_2").textContent =
        phone.monthly_1_23_new;

    document.getElementById("total23_2").textContent =
        phone.total_23months_new;

        phone.monthly_24_47_new;

}
else if(plan === "poikatsu"){

}
else{

        phone.price;

    document.getElementById("monthly123_2").textContent =
        phone.monthly_1_23;

    document.getElementById("total23_2").textContent =
        phone.total_23months;

    document.getElementById("monthly2447_2").textContent =
        phone.monthly_24_47;

}

  document.getElementById("hosho2").textContent =
    phone.keitai_hosho;
    
document.getElementById("recommend2").textContent =
    phone.recommend;

compareRam();
compareRom();
compareBattery();

saveComparisonTemp();    
}

function compareRam(){

    const ram1 =
        parseInt(document.getElementById("ram1").textContent);

    const ram2 =
        parseInt(document.getElementById("ram2").textContent);

    document.getElementById("ram1").className = "";
    document.getElementById("ram2").className = "";

    if(ram1 > ram2){

        document.getElementById("ram1")
            .classList.add("good");

        document.getElementById("ram2")
            .classList.add("bad");

    }else if(ram2 > ram1){

        document.getElementById("ram1")
            .classList.add("bad");

        document.getElementById("ram2")
            .classList.add("good");

    }else{

    document.getElementById("ram1")
        .classList.add("equal");

    document.getElementById("ram2")
        .classList.add("equal");

   }

}
function convertRom(value){

    value = value.trim().toUpperCase();

    if(value.includes("TB")){
        return parseFloat(value) * 1024;
    }

    return parseInt(value);
}

function compareRom(){

    const rom1 = convertRom(
        document.getElementById("rom1").textContent
    );

    const rom2 = convertRom(
        document.getElementById("rom2").textContent
    );

    document.getElementById("rom1").className = "";
    document.getElementById("rom2").className = "";

    if(rom1 > rom2){

        document.getElementById("rom1")
            .classList.add("good");

        document.getElementById("rom2")
            .classList.add("bad");

    }else if(rom2 > rom1){

        document.getElementById("rom1")
            .classList.add("bad");

        document.getElementById("rom2")
            .classList.add("good");

    }else{

        document.getElementById("rom1")
            .classList.add("equal");

        document.getElementById("rom2")
            .classList.add("equal");
    }
}
    function compareBattery(){

const battery1 =
    parseInt(
        document.getElementById("battery1")
        .textContent
        .replace(/[^0-9]/g,"")
    );

const battery2 =
    parseInt(
        document.getElementById("battery2")
        .textContent
        .replace(/[^0-9]/g,"")
    );

    document.getElementById("battery1").className = "";
    document.getElementById("battery2").className = "";

    if(battery1 > battery2){

        document.getElementById("battery1")
            .classList.add("good");

        document.getElementById("battery2")
            .classList.add("bad");

    }else if(battery2 > battery1){

        document.getElementById("battery1")
            .classList.add("bad");

        document.getElementById("battery2")
            .classList.add("good");

}else{

    document.getElementById("battery1")
        .classList.add("equal");

    document.getElementById("battery2")
        .classList.add("equal");

  }

}

function loadModels1(){

    const maker =
        document.getElementById("maker1").value;

    const select =
        document.getElementById("phone1");

    select.innerHTML =
        '<option value="">機種①を選択</option>';

    phonesData
        .filter(phone => phone.maker === maker)
       .sort((a,b) =>
    a.model.localeCompare(
        b.model,
        "ja",
        { numeric: true }
    )
)
        .forEach(phone => {

            const option =
                document.createElement("option");

            option.value = phone.id;
            option.textContent = phone.model;

            select.appendChild(option);

        });

}

function loadModels2(){

    const maker =
        document.getElementById("maker2").value;

    const select =
        document.getElementById("phone2");

    select.innerHTML =
        '<option value="">機種②を選択</option>';

    phonesData
    .filter(phone => phone.maker === maker)
   .sort((a,b) =>
    a.model.localeCompare(
        b.model,
        "ja",
        { numeric: true }
    )
)
    .forEach(phone => {

            const option =
                document.createElement("option");

            option.value = phone.id;
            option.textContent = phone.model;

            select.appendChild(option);

        });

}
    
} catch(e) {

alert("エラー：" + e.message);

}

function saveComparisonTemp(){

    const phone1 =
        document.getElementById("phone1");

    const phone2 =
        document.getElementById("phone2");

    const plan1 =
        document.getElementById("plan1");

    const plan2 =
        document.getElementById("plan2");

    if(
        !phone1.value ||
        !phone2.value ||
        !plan1.value ||
        !plan2.value
    ){
        return;
    }

    localStorage.setItem(
        "latestComparison",
        JSON.stringify({
            phone1:
                phone1.options[phone1.selectedIndex]
                .text,

            plan1:
                plan1.options[plan1.selectedIndex]
                .text,

            phone2:
                phone2.options[phone2.selectedIndex]
                .text,

            plan2:
                plan2.options[plan2.selectedIndex]
                .text
        })
    );

}    

async function saveComparisonLog(){

    const comparison =
        JSON.parse(
            localStorage.getItem(
                "latestComparison"
            )
        );

    if(!comparison){
        return;
    }

    const { error } =
        await sbClient
        .from("ComparisonLog")
        .insert([{

            phone1: comparison.phone1,
            plan1: comparison.plan1,

            phone2: comparison.phone2,
            plan2: comparison.plan2,

            status: "検討中"

        }]);

    if(error){

        alert(error.message);
        return;

    }

    localStorage.removeItem(
        "latestComparison"
    );

}    

async function leavePage(url){

    const comparison =
        JSON.parse(
            localStorage.getItem(
                "latestComparison"
            )
        );

    if(comparison){

        await saveComparisonLog();

    }

    location.href = url;

}    

    
</script>
