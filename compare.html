<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smaport 比較ページ</title>

<style>
body{
    font-family: Yu Gothic,sans-serif;
    margin:0;
    background:#f8fafc;
}

header{
    background:#2563EB;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:30px;
}

.selector{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:30px;
}

select{
    padding:15px;
    border:1px solid #ddd;
    border-radius:10px;
}

.compare-box{
    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#2563EB;
    color:white;
    padding:15px;
}

td{
    padding:15px;
    border-bottom:1px solid #eee;
}

.back{
    display:inline-block;
    margin-bottom:20px;
    color:#2563EB;
    text-decoration:none;
}
</style>

</head>
<body>

<header>
<h1>Smaport 比較ページ</h1>
</header>

<div class="container">

<a href="index.html" class="back">
← トップへ戻る
</a>

<div class="selector">

<select id="maker1" onchange="loadModels1()">
    <option value="">メーカー①を選択</option>
</select>

<select id="maker2" onchange="loadModels2()">
    <option value="">メーカー②を選択</option>
</select>

<select id="phone1" onchange="showPhone1()">
    <option value="">機種①を選択</option>
</select>

<select id="phone2" onchange="showPhone2()">
    <option value="">機種②を選択</option>
</select>
    
</div>

<div class="compare-box">

<table>

<tr>
<th>項目</th>
<th>機種①</th>
<th>機種②</th>
</tr>

<tr>
    <td>カラー</td>
    <td id="color1">-</td>
    <td id="color2">-</td>
</tr>

<tr>
    <td>画像</td>
    <td id="image1">-</td>
    <td id="image2">-</td>
</tr>

<tr>
    <td>ディスプレイサイズ</td>
    <td id="display1">-</td>
    <td id="display2">-</td>
</tr>

<tr>
    <td>RAM</td>
    <td id="ram1">-</td>
    <td id="ram2">-</td>
</tr>

<tr>
    <td>ROM</td>
    <td id="rom1">-</td>
    <td id="rom2">-</td>
</tr>

<tr>
    <td>バッテリー</td>
    <td id="battery1">-</td>
    <td id="battery2">-</td>
</tr>

<tr>
    <td>画素数</td>
    <td id="camera1">-</td>
    <td id="camera2">-</td>
</tr>

<tr>
    <td>一括価格</td>
    <td id="price1">-</td>
    <td id="price2">-</td>
</tr>

<tr>
    <td>カエドキ1～23回</td>
    <td id="monthly123_1">-</td>
    <td id="monthly123_2">-</td>
</tr>

<tr>
    <td>カエドキ24～47回</td>
    <td id="monthly2447_1">-</td>
    <td id="monthly2447_2">-</td>
</tr>

<tr>
    <td>おすすめポイント</td>
    <td id="recommend1">-</td>
    <td id="recommend2">-</td>
</tr>

</table>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl = "https://butujlsbdxaiuxitfyty.supabase.co";
    
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1dHVqbHNiZHhhaXV4aXRmeXR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MjI2OTUsImV4cCI6MjEwMzI5ODY5NX0.yDC6HpV6rQzeG88sVwDlLOPB1dC_I-r5ID1JXoTeCAU";

try {

const supabase = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

let phonesData = [];

async function loadPhones(){

const { data, error } = await supabase
    .from("Phones")
    .select("*");

if(error){
alert("エラー：" + error.message);
return;
}

alert("件数=" + data.length);

phonesData = data;
    
const maker1 = document.getElementById("maker1");
const maker2 = document.getElementById("maker2");

const makers = [...new Set(
    data.map(phone => phone.maker)
)];

makers.forEach(maker => {

    const option1 = document.createElement("option");
    option1.value = maker;
    option1.textContent = maker;

    const option2 = document.createElement("option");
    option2.value = maker;
    option2.textContent = maker;

    maker1.appendChild(option1);
    maker2.appendChild(option2);

});    
   
}

loadPhones();

function showPhone1(){

    const selectedId =
        document.getElementById("phone1").value;

    const phone =
        phonesData.find(p => p.id == selectedId);

    if(!phone) return;

document.getElementById("color1").textContent =
phone.color;

document.getElementById("image1").innerHTML =
    '<imgphone.image_url + '';

document.getElementById("display1").textContent=
    phone.display_size;

document.getElementById("ram1").textContent = phone.ram;
document.getElementById("rom1").textContent = phone.rom;
document.getElementById("battery1").textContent = phone.battery;
document.getElementById("camera1").textContent = phone.camera;
document.getElementById("price1").textContent = phone.price;
document.getElementById("monthly123_1").textContent = phone.monthly_1_23;
document.getElementById("monthly2447_1").textContent = phone.monthly_24_47;
document.getElementById("recommend1").textContent = phone.recommend;

}

function showPhone2(){

    const selectedId =
        document.getElementById("phone2").value;

    const phone =
        phonesData.find(p => p.id == selectedId);

    if(!phone) return;

document.getElementById("color2").textContent = phone.color;
    
document.getElementById("image2").innerHTML =
    '<imgphone.image_url + '';

document.getElementById("display2").textContent =
    phone.display_size;

document.getElementById("ram2").textContent =
    phone.ram;

document.getElementById("rom2").textContent =
    phone.rom;

document.getElementById("battery2").textContent =
    phone.battery;

document.getElementById("camera2").textContent =
    phone.camera;

document.getElementById("price2").textContent =
    phone.price;

document.getElementById("monthly123_2").textContent =
    phone.monthly_1_23;

document.getElementById("monthly2447_2").textContent =
    phone.monthly_24_47;

document.getElementById("recommend2").textContent =
    phone.recommend;

}

function loadModels1(){

    const maker =
        document.getElementById("maker1").value;

    const select =
        document.getElementById("phone1");

    select.innerHTML =
        '<option value="">機種①を選択</option>';

    phonesData
        .filter(phone => phone.maker === maker)
        .forEach(phone => {

            const option =
                document.createElement("option");

            option.value = phone.id;
            option.textContent = phone.model;

            select.appendChild(option);

        });

}

function loadModels2(){

    const maker =
        document.getElementById("maker2").value;

    const select =
        document.getElementById("phone2");

    select.innerHTML =
        '<option value="">機種②を選択</option>';

    phonesData
        .filter(phone => phone.maker === maker)
        .forEach(phone => {

            const option =
                document.createElement("option");

            option.value = phone.id;
            option.textContent = phone.model;

            select.appendChild(option);

        });

}
    
} catch(e) {

alert("エラー：" + e.message);

}
    
</script>

</body>
</html>
