<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>機種比較ツール</title>

<style>
body{
    font-family:sans-serif;
    background:#fff8f0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    width:600px;
    padding:50px;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,0.1);
    border-top:8px solid #D32F2F;

    text-align:center;
}

h1{
    font-size: 3.5rem;
    color: #3366F5;
    text-align: center;
}

p{
    font-size:1.4rem;
}    

select{
    width:100%;
    padding:18px;
    font-size:1.2rem;
    border-radius:10px;
}

button{
    width:100%;
    padding:18px;
    font-size:1.3rem;
    font-weight:bold;
    border:none;
    border-radius:10px;
    background:#D32F2F;
    color:white;
    cursor:pointer;
}

 .store-label{
    text-align:center;
    display:block;
    margin-bottom:15px;
    font-size:1.3rem;
    font-weight:bold;
}

.logo{
    font-size:4rem;
    font-weight:700;
    color:#3366F5;
    margin-bottom:8px;
}

.subtitle{
    font-size:1.1rem;
    color:#6b7280;
    margin-bottom:50px;
}


.container{
    text-align:center;
}
    
</style>
</head>

<body>

<div class="container">

<h1 class="logo">Smaport</h1>
<p class="subtitle">
スマホ比較 × 接客支援ツール
</p>    

<p>🏪 店舗を選択してください</p>

<select id="store">
<option>イオンモール高の原</option>
<option>葛城南</option>
<option>北野白梅町</option>
<option>西大寺</option>
<option>桜井</option>
<option>天理</option>
<option>桃谷</option>
<option>大和高田</option>
</select>

<button onclick="login()">ログイン</button>

</div>

<script>
function login(){
    const store=document.getElementById("store").value;
    localStorage.setItem("store",store);
    location.href="index.html";
}
</script>

</body>
</html>
