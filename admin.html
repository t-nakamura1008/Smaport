<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>見積管理</title>

<style>

body{
  font-family:'Segoe UI',sans-serif;
  background:#f5f7fb;
  padding:30px;
}

.container{
  max-width:900px;
  margin:auto;
}

.card{
  background:white;
  padding:25px;
  border-radius:16px;
  margin-bottom:20px;
}

h1{
  text-align:center;
  margin-top:0;
}

input[type="date"]{
  width:100%;
  padding:15px;
  font-size:18px;
  border-radius:10px;
  border:1px solid #ddd;
  box-sizing:border-box;
}

button{
  width:100%;
  margin-top:15px;
  padding:15px;
  font-size:18px;
  font-weight:bold;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

.result-row{
  background:#f8fafc;
  border-radius:12px;
  padding:18px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
}

.result-row:hover{
  background:#dbeafe;
}

.print-no{
  font-size:22px;
  font-weight:bold;
}

.time{
  color:#666;
  font-size:16px;
}

.no-data{
  text-align:center;
  color:#666;
  padding:30px;
}

</style>

</head>

<body>

<div class="container">

  <div class="card">

    <h1 id="adminTitle">
      📋 見積管理
    </h1>

    <input
      type="date"
      id="searchDate"
    >

    <button onclick="searchByDate()">
      検索
    </button>

  </div>

  <div
    class="card"
    id="resultArea"
  >
    検索してください
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ==========
   店舗チェック
========== */

const store =
  localStorage.getItem("store");

if(!store){

  alert("店舗ログインしてください");

  location.href = "login.html";

}

/* ==========
   タイトル
========== */

document.getElementById(
  "adminTitle"
).textContent =
  `📋 ${store} 見積管理`;

/* ==========
   今日を初期表示
========== */

document.getElementById(
  "searchDate"
).value =
  new Date()
    .toISOString()
    .split("T")[0];

/* ==========
   Supabase
========== */

const supabaseUrl =
  "https://butujlsbdxaiuxitfyty.supabase.co";

const supabaseKey =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1dHVqbHNiZHhhaXV4aXRmeXR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MjI2OTUsImV4cCI6MjEwMzI5ODY5NX0.yDC6HpV6rQzeG88sVwDlLOPB1dC_I-r5ID1JXoTeCAU";

const mySupabase =
  window.supabase.createClient(
    supabaseUrl,
    supabaseKey
  );

/* ==========
   日付検索
========== */

async function searchByDate(){

  const date =
    document.getElementById(
      "searchDate"
    ).value;

  const start =
    date + "T00:00:00";

  const end =
    date + "T23:59:59";

  const { data, error } =
    await mySupabase
      .from("estimates")
      .select("*")
      .eq("store", store)
      .gte(
        "created_at",
        start
      )
      .lte(
        "created_at",
        end
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );

  if(error){

    console.error(error);

    alert("検索失敗");

    return;

  }

  let html = "";

  data.forEach(item => {

    const time =
  new Date(item.created_at)
    .toLocaleTimeString(
      "ja-JP",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

html += `
  <div
    class="result-row"
    onclick="openEstimate(${item.id})"
  >

    <div class="print-no">
      ${item.print_no}
    </div>

    <div class="time">
      ${time}
    </div>

  </div>
`;

});

if(html === ""){

  html =
    '<div class="no-data">該当データなし</div>';

}

document.getElementById(
  "resultArea"
).innerHTML = html;

}

async function openEstimate(id){

  const { data, error } =
    await mySupabase
      .from("estimates")
      .select("*")
      .eq("id", id)
      .single();

  if(error){

    console.error(error);

    alert("見積取得失敗");

    return;

  }

  localStorage.setItem(
    "estimateData",
    JSON.stringify(
      data.estimate_data
    )
  );

  localStorage.setItem(
    "adminView",
    "true"
  );

  location.href =
    "detail.html";

}

</script>

</body>
</html>
