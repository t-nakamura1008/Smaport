<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ゴミ箱</title>

<style>

body{
    margin:0;
    font-family:"Yu Gothic",sans-serif;
    background:#f8fafc;
}

header{
    background:#EF4444;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:30px auto;
    padding:20px;
}

.device{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:15px;
    padding:20px;
    margin-bottom:15px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.restore-btn{
    background:#10B981;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
}

.restore-btn:hover{
    background:#059669;
}

.back-btn{
    background:#FACC15;
    color:white;
    text-decoration:none;

    padding:12px 20px;

    border-radius:12px;

    font-size:16px;
    font-weight:bold;

    display:inline-block;
}

.delete-selected-btn{
    background:#F97316;
    color:white;
    border:none;
    padding:16px 28px;
    border-radius:14px;
    cursor:pointer;
    font-weight:bold;
    font-size:16px;
    margin-right:10px;
}

.delete-selected-btn:hover{
    background:#EA580C;
}

.delete-all-btn{
    background:#EF4444;
    color:white;
    border:none;
    padding:16px 28px;
    border-radius:14px;
    cursor:pointer;
    font-weight:bold;
    font-size:16px;
}

.delete-all-btn:hover{
    background:#DC2626;
}

.sort-btn{
    background:#374151;
    color:white;
    border:none;
    padding:16px 28px;
    border-radius:14px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    margin:10px;
}

.sort-btn:hover{
    background:#1F2937;
}
    
</style>
</head>
<body>

<header>
<h1>🗑️ ゴミ箱</h1>
</header>

<button
class="delete-selected-btn"
onclick="deleteSelectedTrash()">

✅ 選択削除

</button>

<button
class="delete-all-btn"
onclick="deleteAllTrash()">

🗑️ ゴミ箱を空にする

</button>

 <button
class="sort-btn"
onclick="toggleSortOrder()">

⬇️ 新しい順

</button>
   
<div class="container">

<div id="trashList">

読み込み中...

</div>

<br>

<button
class="back-btn"
onclick="location.href='authority.html'">

← 権限者用管理画面へ戻る

</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl =
"https://butujlsbdxaiuxitfyty.supabase.co";

const supabaseKey =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1dHVqbHNiZHhhaXV4aXRmeXR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MjI2OTUsImV4cCI6MjEwMzI5ODY5NX0.yDC6HpV6rQzeG88sVwDlLOPB1dC_I-r5ID1JXoTeCAU";

const sb =
window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

let sortOrder = "new";
    
async function loadTrash(){

    const { data, error } = await sb
    .from("Phones")
    .select("*")
    .eq("deleted", true)
    .order(
        "id",
        {
            ascending: sortOrder === "old"
        }
    );


    if(error){
        alert(error.message);
        return;
    }

    trashList.innerHTML = "";

    if(data.length === 0){

        trashList.innerHTML =
            "<h2>ゴミ箱は空です</h2>";

        return;
    }

    data.forEach(phone => {

        trashList.innerHTML += `
        
<div class="device">

    <input
    type="checkbox"
    class="trash-check"
    value="${phone.id}">

    <div>${phone.maker}</div>

    <h3>${phone.model}</h3>


    <button
        class="restore-btn"
        onclick="restorePhone(${phone.id})">

        ♻️ 復元

    </button>

</div>

`;

    });

}

async function restorePhone(id){

    if(!confirm("この機種を機種一覧へ復元しますか？")){
        return;
    }

    // 機種名取得
    const { data: phone, error: phoneError } = await sb
        .from("Phones")
        .select("model")
        .eq("id", id)
        .single();

    if(phoneError){
        alert(phoneError.message);
        return;
    }

    // 復元
    const { error } = await sb
        .from("Phones")
        .update({
            deleted:false
        })
        .eq("id", id);

    if(error){
        alert(error.message);
        return;
    }

    // 履歴保存
    await sb
        .from("History")
        .insert([{
            action: "復元",
            model: phone.model
        }]);

    alert("復元しました");

    loadTrash();
}

loadTrash();

 async function deleteSelectedTrash(){

    const checked = [
        ...document.querySelectorAll(
            ".trash-check:checked"
        )
    ].map(x => Number(x.value));

    if(checked.length === 0){

        alert("削除する機種を選択してください");
        return;
    }

    if(!confirm(
        "選択した機種を完全削除しますか？\nこの操作は元に戻せません。"
    )){
        return;
    }

   const { error } = await sb
    .from("Phones")
    .delete()
    .in("id", checked);
 

    if(error){
        alert(error.message);
        return;
    }

    alert("削除しました");

    loadTrash();
}
   
async function deleteAllTrash(){

    if(!confirm(
        "ゴミ箱内の機種を全て削除しますか？\nこの操作は元に戻せません。"
    )){
        return;
    }

    const { error } = await sb
        .from("Phones")
        .delete()
        .eq("deleted", true);

    if(error){
        alert(error.message);
        return;
    }

    alert("ゴミ箱を空にしました");

    loadTrash();
}

function toggleSortOrder(){

    const btn =
        document.querySelector(".sort-btn");

    if(sortOrder === "new"){

        sortOrder = "old";

        btn.textContent =
            "⬆️ 古い順";

    }else{

        sortOrder = "new";

        btn.textContent =
            "⬇️ 新しい順";

    }

    loadTrash();
}
    
</script>

</body>

</html>
