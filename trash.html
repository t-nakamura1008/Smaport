async function loadTrash(){

    const { data, error } = await sb
        .from("Phones")
        .select("*")
        .eq("deleted", true)
        .order("id", { ascending:false });

    if(error){
        alert(error.message);
        return;
    }

    trashList.innerHTML = "";

    if(data.length === 0){

        trashList.innerHTML =
            "<h2>ゴミ箱は空です</h2>";

        return;
    }

    data.forEach(phone => {

        trashList.innerHTML += `
        
<div class="device">

    <div>${phone.maker}</div>

    <h3>${phone.model}</h3>

    <button
        class="restore-btn"
        onclick="restorePhone(${phone.id})">

        ♻️ 復元

    </button>

</div>

`;

    });

}
