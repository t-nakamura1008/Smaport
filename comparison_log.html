const sbClient =
window.supabase.createClient(
    supabaseUrl,

);

loadLogs();

async function loadLogs(){

    const { data, error } =
        await sbClient
        .from("ComparisonLog")
        .select("*")
        .order("created_at",{ascending:false});

    if(error){

        alert(error.message);
        return;

    }

    const table =
        document.getElementById("logTable");

    table.innerHTML = "";

    data.forEach(log => {

        table.innerHTML += `

        <tr>

            <td>${log.phone1}</td>

            <td>${log.phone2}</td>

            <td>${log.status}</td>

            <td>${log.result_phone ?? "-"}</td>

        </tr>

        `;

    });

}
