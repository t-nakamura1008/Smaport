<script>

const supabaseUrl =
"https://butujlsbdxaiuxitfyty.supabase.co";
  
const supabaseKey =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1dHVqbHNiZHhhaXV4aXRmeXR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MjI2OTUsImV4cCI6MjEwMzI5ODY5NX0.yDC6HpV6rQzeG88sVwDlLOPB1dC_I-r5ID1JXoTeCAU";

const sbClient =
window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

loadLogs();

async function loadLogs(){

    const { data, error } =
        await sbClient
        .from("ComparisonLog")
        .select("*")
        .order("created_at",{ascending:false});

    if(error){

    alert(error.message);
    return;

}

const contractCount =
    data.filter(
        log => log.status === "成約"
    ).length;

document.getElementById("countArea")
.innerHTML = `

<button
    class="close-btn"
    onclick="toggleCount()">

    ✖ 閉じる

</button>

<br><br>

現在の比較件数：${data.length}件

<br>

成約件数：${contractCount}件

<br>

成約率：${rate}%

`;

 const ranking = {};

data.forEach(log => {

    if(
        log.status === "成約" &&
        log.result_phone
    ){

        ranking[log.result_phone] =
            (ranking[log.result_phone] || 0) + 1;

    }

});

const rankingHtml =
    Object.entries(ranking)

    .sort((a,b) => b[1] - a[1])

    .slice(0,5)

    .map((item,index) => {

        const medal =
            index === 0 ? "🥇" :
            index === 1 ? "🥈" :
            index === 2 ? "🥉" :
            "🏅";

        return `
            <div>
                ${medal}
                ${item[0]}
                （${item[1]}件）
            </div>
        `;

    })

    .join("");

document.getElementById("rankingArea")
.innerHTML = `

<button
class="close-btn"
onclick="toggleRanking()">

✖ 閉じる

</button>

<h2>🏆 成約ランキング TOP5</h2>

${rankingHtml}

`;   

const table =
    document.getElementById("logTable");

    table.innerHTML = "";

    data.forEach(log => {

    table.innerHTML += `

    <tr>

　　　　<td>
${new Date(log.created_at)
    .toLocaleString("ja-JP")}
</td>

        <td>${log.phone1}</td>

        <td>${log.phone2}</td>

        <td>${log.status}</td>

        <td>${log.result_phone ?? "-"}</td>

        <td>

           ${
    log.status === "検討中"
    ? `
        <button
            class="contract-btn"
            onclick="registerContract(

                '${log.phone1}'
            )">

        </button>

<td>

});

}
   
async function registerContract(
    id,
    resultPhone
){

    const { error } =
        await sbClient
        .from("ComparisonLog")
        .update({

            status:"成約",
            result_phone:resultPhone

        })
        .eq("id",id);

    if(error){

        alert(error.message);
        return;

    }

    alert("成約登録しました");

   loadLogs();

  }  

  async function deleteLog(id){

    if(
        !confirm("このログを削除しますか？")
    ){
        return;
    }

    const { error } =
        await sbClient
        .from("ComparisonLog")
        .delete()
        .eq("id",id);

    if(error){

        alert(error.message);
        return;

    }

    loadLogs();

}
