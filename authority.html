<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>権限者用管理画面</title>

<style>

body{
    background:#FEFCE8;
}

header{
    background:#FACC15;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    max-width:900px;
    margin:30px auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.menu-btn{
    width:100%;
    padding:18px;
    margin-bottom:15px;
    border:none;
    border-radius:15px;
    background:#FB923C;
    color:white;
    font-size:18px;
    cursor:pointer;
    font-weight:bold;
}

.menu-btn{
    background:#FCD34D;
}

 .menu-btn:hover{
    background:#FBBF24;
}

.trash-btn{
    background:#EF4444;
}

.trash-btn:hover{
    background:#DC2626;
}

.history-btn{
    background:#F9A8D4;
}

.history-btn:hover{
    background:#F472B6;
}

.admin-btn{
    background:#8B5CF6;
    color:white;
}

.admin-btn:hover{
    background:#7C3AED;
} 
    
.back-btn{
    background:#6EE7B7;
    color:white;
}

.back-btn:hover{
    background:#34D399;
}

.compare-log-btn{

    background:#38BDF8;
    color:white;

    border:none;

    padding:15px 25px;

    border-radius:12px;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;

}

.compare-log-btn:hover{

    background:#0EA5E9;

}    
    
</style>
</head>
<body>

<header>

<h1>🛠️ 権限者用管理画面</h1>

</header>

<div class="container">

<div class="card">

<button
class="menu-btn trash-btn"
onclick="location.href='trash.html'">

🗑️ ゴミ箱

</button>


<button
class="menu-btn history-btn"
onclick="location.href='history.html'">

📋 監査ログ

</button>

<button class="menu-btn compare-log-btn">
    📊 比較ログ
</button>   

<button
class="menu-btn admin-btn"
onclick="location.href='admin/dashboard.html'">

🏠 Smaport Admin

</button>
    
<button
class="menu-btn back-btn"
onclick="logoutAuthority()">

🚪 ログアウト

</button>

</div>

</div>
<script>

function logoutAuthority(){

    sessionStorage.removeItem("authorityLogin");

    location.href = "authority-login.html";

}

</script>
    
</body>
</html>
